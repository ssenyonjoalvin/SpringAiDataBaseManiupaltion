#for the SQL
# Use a database user with read-only (SELECT-only) privileges for defense in depth --
# the application enforces read-only access in code, but a read-only DB credential means
# even a code-level bug cannot result in a write.
spring.datasource.url=jdbc:mysql://localhost/toolsdriver_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=



# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Generic AI query limits (see com.example.demo.ai.query.config.AiQueryProperties)
ai.query.default-page-size=20
ai.query.max-page-size=100
ai.query.max-filters=10
ai.query.max-selected-fields=25
ai.query.max-sort-fields=5