spring.application.name=demo-test

spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=https://example.invalid/v1
spring.ai.openai.chat.options.model=test-model

spring.datasource.url=jdbc:h2:mem:aiquerytest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

ai.query.default-page-size=10
ai.query.max-page-size=50
ai.query.max-filters=5
ai.query.max-selected-fields=10
ai.query.max-sort-fields=3
